name: Supply Chain Intelligence CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    # Tells Python where to look for your modules (intelligence_engine, backend, data_pipeline)
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Test Suite
      run: |
        pytest tests/ -v

    - name: Verify FastAPI Syntax & Import Integrity
      run: |
        python -c "from backend.main import app; print('FastAPI successfully initialized')"
