name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: supply_user
          POSTGRES_PASSWORD: supply_pass
          POSTGRES_DB: supply_chain
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://supply_user:supply_pass@localhost:5432/supply_chain
      # Placeholder keeps imports alive in CI; real calls are mocked in tests
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-placeholder-for-ci' }}
      APP_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff) — Python dirs only
        # Scope to Python source dirs to avoid non-Python root artefacts
        run: |
          pip install ruff
          ruff check intelligence_engine/ backend/ data_pipeline/ python/ tests/ \
            --select E,W,F --ignore E501 \
            --exclude "*.sql" \
            || echo "::warning::Lint issues found — fix before merging to main"

      - name: Run tests
        run: |
          # Collect first; skip gracefully if no tests exist yet
          COUNT=$(pytest tests/ --collect-only -q 2>/dev/null | tail -1 | awk '{print $1}')
          if [ "$COUNT" = "no" ] || [ -z "$COUNT" ]; then
            echo "No tests collected — skipping"
          else
            pytest tests/ -v --tb=short -m "not llm"
          fi

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t supply-chain-intelligence:ci .
