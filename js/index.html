<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Supply Chain Data Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #080c10; --panel: #0d1318; --border: #1a2a1a;
    --green: #00ff88; --green-dim: #00cc6a; --amber: #ffb300;
    --red: #ff4444; --text: #c8d8c8; --muted: #4a6a4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px; position: relative; }
  body::before { content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0; }
  .container { width: 100%; max-width: 860px; position: relative; z-index: 1; }
  .header { text-align: center; margin-bottom: 40px; animation: fadeDown 0.6s ease both; }
  .header .label { font-size: 11px; letter-spacing: 6px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
  .header h1 { font-family: 'Syne', sans-serif; font-size: clamp(26px, 5vw, 44px);
    font-weight: 800; color: var(--green); text-shadow: 0 0 40px rgba(0,255,136,0.3); line-height: 1.1; }
  .header h1 span { color: var(--text); }
  .header .sub { margin-top: 10px; font-size: 12px; color: var(--muted); letter-spacing: 2px; }
  .stats-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    margin-bottom: 24px; animation: fadeUp 0.6s 0.1s ease both; }
  .stat-card { background: var(--panel); border: 1px solid var(--border);
    border-top: 2px solid var(--muted); padding: 14px 10px; text-align: center; transition: border-color 0.3s; }
  .stat-card.active { border-top-color: var(--amber); }
  .stat-card.done { border-top-color: var(--green); }
  .stat-card .num { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800;
    color: var(--green); display: block; transition: color 0.3s; }
  .stat-card.active .num { color: var(--amber); }
  .stat-card .lbl { font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
  .panel { background: var(--panel); border: 1px solid var(--border); margin-bottom: 16px; animation: fadeUp 0.6s 0.2s ease both; }
  .panel-header { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .panel-header .title { font-size: 11px; letter-spacing: 3px; color: var(--green); text-transform: uppercase; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background 0.3s, box-shadow 0.3s; }
  .dot.live { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1s infinite; }
  .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .config-field { padding: 20px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .config-field:nth-child(even) { border-right: none; }
  .config-field:nth-last-child(-n+2) { border-bottom: none; }
  .config-field label { display: block; font-size: 9px; letter-spacing: 3px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 8px; }
  .config-field input { width: 100%; background: transparent; border: none;
    border-bottom: 1px solid var(--border); color: var(--text);
    font-family: 'Share Tech Mono', monospace; font-size: 14px; padding: 6px 0; outline: none; transition: border-color 0.2s; }
  .config-field input:focus { border-color: var(--green); }
  .terminal { background: #050809; border: 1px solid var(--border); height: 320px;
    overflow-y: auto; padding: 20px; font-size: 13px; line-height: 1.8;
    margin-bottom: 16px; animation: fadeUp 0.6s 0.3s ease both; scroll-behavior: smooth; }
  .terminal::-webkit-scrollbar { width: 4px; }
  .terminal::-webkit-scrollbar-thumb { background: var(--border); }
  .log-line { display: flex; gap: 12px; align-items: flex-start; }
  .log-line .ts { color: var(--muted); font-size: 11px; min-width: 60px; padding-top: 2px; }
  .log-line .msg { flex: 1; }
  .log-line.success .msg { color: var(--green); }
  .log-line.error .msg { color: var(--red); }
  .log-line.done .msg { color: var(--amber); font-weight: bold; }
  .cursor { display: inline-block; width: 8px; height: 14px; background: var(--green);
    animation: blink 1s infinite; vertical-align: middle; margin-left: 4px; }
  .progress-wrap { margin-bottom: 16px; animation: fadeUp 0.6s 0.35s ease both; }
  .progress-bar-bg { height: 3px; background: var(--border); width: 100%; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green-dim), var(--green));
    width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px var(--green); }
  .progress-label { display: flex; justify-content: space-between; margin-top: 8px;
    font-size: 10px; color: var(--muted); letter-spacing: 2px; }
  .btn { width: 100%; padding: 18px; background: transparent; border: 1px solid var(--green);
    color: var(--green); font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
    letter-spacing: 6px; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
    position: relative; overflow: hidden; animation: fadeUp 0.6s 0.4s ease both; }
  .btn::before { content: ''; position: absolute; inset: 0; background: var(--green);
    transform: translateX(-100%); transition: transform 0.3s ease; z-index: 0; }
  .btn:hover::before { transform: translateX(0); }
  .btn:hover { color: var(--bg); }
  .btn span { position: relative; z-index: 1; }
  .btn:disabled { border-color: var(--muted); color: var(--muted); cursor: not-allowed; }
  .btn:disabled::before { display: none; }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="label">Supply Chain Intelligence</div>
    <h1>DATA <span>GENERATOR</span></h1>
    <div class="sub">MySQL · Node.js · 9,450 rows across 5 tables</div>
  </div>
  <div class="stats-bar">
    <div class="stat-card" id="stat-suppliers"><span class="num">50</span><div class="lbl">Suppliers</div></div>
    <div class="stat-card" id="stat-products"><span class="num">200</span><div class="lbl">Products</div></div>
    <div class="stat-card" id="stat-inventory"><span class="num">200</span><div class="lbl">Inventory</div></div>
    <div class="stat-card" id="stat-orders"><span class="num">5,000</span><div class="lbl">Orders</div></div>
    <div class="stat-card" id="stat-shipments"><span class="num">4,000</span><div class="lbl">Shipments</div></div>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span class="title">// DB Connection Config</span>
      <div class="dot" id="conn-dot"></div>
    </div>
    <div class="config-grid">
      <div class="config-field"><label>Host</label><input type="text" id="cfg-host" value="localhost"/></div>
      <div class="config-field"><label>Database</label><input type="text" id="cfg-db" value="supply_chain"/></div>
      <div class="config-field"><label>Username</label><input type="text" id="cfg-user" value="root"/></div>
      <div class="config-field"><label>Password</label><input type="password" id="cfg-pass" placeholder="••••••••"/></div>
    </div>
  </div>
  <div class="terminal" id="terminal">
    <div class="log-line info">
      <span class="ts">--:--:--</span>
      <span class="msg">System ready. Configure DB and click GENERATE.<span class="cursor"></span></span>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress-label"><span id="progress-text">AWAITING INPUT</span><span id="progress-pct">0%</span></div>
  </div>
  <button class="btn" id="gen-btn" onclick="runGenerator()"><span>⚡ Generate All Data</span></button>
</div>
<script>
  const steps = ['suppliers','products','inventory','orders','shipments'];
  const stepProgress = { suppliers: 20, products: 40, inventory: 55, orders: 80, shipments: 100 };
  function ts() { return new Date().toTimeString().slice(0,8); }
  function log(msg, type = 'info') {
    const term = document.getElementById('terminal');
    const line = document.createElement('div');
    line.className = `log-line ${type}`;
    line.innerHTML = `<span class="ts">${ts()}</span><span class="msg">${msg}</span>`;
    term.appendChild(line);
    term.scrollTop = term.scrollHeight;
  }
  function setProgress(pct, label) {
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-text').textContent = label;
  }
  function activateStat(table) {
    const idx = steps.indexOf(table);
    if (idx >= 0) {
      steps.slice(0, idx).forEach(s => { const c = document.getElementById(`stat-${s}`); c.classList.remove('active'); c.classList.add('done'); });
      const cur = document.getElementById(`stat-${table}`); cur.classList.remove('done'); cur.classList.add('active');
    }
  }
  function allDone() { steps.forEach(s => { const c = document.getElementById(`stat-${s}`); c.classList.remove('active'); c.classList.add('done'); }); }
  async function runGenerator() {
    const btn = document.getElementById('gen-btn');
    const dot = document.getElementById('conn-dot');
    document.getElementById('terminal').innerHTML = '';
    btn.disabled = true; dot.classList.add('live');
    log('Initiating connection to MySQL...'); setProgress(5, 'CONNECTING');
    try {
      const res = await fetch('/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host: document.getElementById('cfg-host').value,
          database: document.getElementById('cfg-db').value,
          user: document.getElementById('cfg-user').value,
          password: document.getElementById('cfg-pass').value }) });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n'); buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const raw = line.slice(5).trim(); if (!raw) continue;
          const { msg, type } = JSON.parse(raw); if (type === 'end') break;
          log(msg, type);
          for (const [table, pct] of Object.entries(stepProgress)) {
            if (msg.toLowerCase().includes(table)) {
              if (msg.includes('⏳')) { activateStat(table); setProgress(pct - 10, `GENERATING ${table.toUpperCase()}`); }
              if (msg.includes('✅')) setProgress(pct, `${table.toUpperCase()} DONE`);
            }
          }
          if (type === 'done') { allDone(); setProgress(100, 'COMPLETE'); dot.classList.remove('live'); }
          if (type === 'error') { dot.classList.remove('live'); setProgress(0, 'ERROR'); }
        }
      }
    } catch (err) {
      log(`❌ Could not reach server: ${err.message}`, 'error');
      log('Make sure server.js is running: node server.js', 'info');
      dot.classList.remove('live'); setProgress(0, 'FAILED');
    }
    btn.disabled = false;
  }
</script>
</body>
</html>
